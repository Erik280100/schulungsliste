name: Build und Deploy

# Bei jedem Push auf main wird gebaut (prüft, dass die App kompiliert).
# Veröffentlicht auf GitHub Pages wird nur, wenn der Workflow von Hand gestartet wird
# (Actions -> "Build und Deploy" -> Run workflow). Für automatisches Deploy bei jedem Push
# beim Job "deploy" die Zeile "if: ..." entfernen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
