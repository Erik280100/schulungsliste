name: Deploy auf GitHub Pages

# Wird bewusst nur von Hand gestartet (Actions -> "Deploy auf GitHub Pages" -> Run workflow),
# damit nichts ungewollt veröffentlicht wird. Für automatisches Deploy bei jedem Push
# einfach "push: branches: [main]" unter "on:" ergänzen.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
